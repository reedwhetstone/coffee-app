name: Code Quality

on:
  push:
    # Only `main`. Branch heads are covered by `pull_request`; listing them here too
    # runs every job twice on each push to a branch with an open PR.
    branches: [main]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# A newer push to the same PR supersedes the run in flight. Every other run gets its own
# group: a shared group holds one pending run and drops the rest even without
# cancel-in-progress, which would leave a `main` commit untested when merges land close together.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Format, Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Enforce Parchment migration authority
        run: pnpm verify:migration-authority

      - name: Create dummy .env for type checking
        run: |
          cat <<EOF > .env
          PUBLIC_SUPABASE_URL=https://dummy.supabase.co
          PUBLIC_SUPABASE_ANON_KEY=dummy
          ACCOUNT_DELETION_REAUTH_ISSUER=https://www.purveyors.io
          ACCOUNT_DELETION_REAUTH_AUDIENCE=https://api.purveyors.io/v1/account-deletion
          ACCOUNT_DELETION_REAUTH_PRIVATE_KEYS=dummy
          ACCOUNT_DELETION_REAUTH_ACTIVE_KID=dummy
          EOF

      - name: Type check
        run: pnpm check --fail-on-warnings

      # `pnpm lint` is the formatting gate: it runs `prettier --check .` before ESLint.
      # Do not add `pnpm format --check` here; `format` passes `--write`, which rewrites
      # the checkout and exits 0, so unformatted files would pass.
      - name: Lint
        run: pnpm lint --max-warnings 0

  unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests
        run: pnpm test
